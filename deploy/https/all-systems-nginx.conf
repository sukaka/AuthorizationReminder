map $server_port $route_upstream {
  443 web-ai-assistant:80;
  5179 api:5179;
  5180 auth:5180;
  5182 ticketing:5182;
  5183 inventory-api:5183;
  5184 device-flow-api:5184;
  5185 delivery-api:5185;
  5186 faq-api:5186;
  5187 tender-api:5187;
  5188 train-exam-api:5188;
  5189 prompt-center-api:5189;
  5190 shipping-gateway:5190;
  5191 sca-api:5191;
  5192 big-screen-api:5192;
  5193 ai-assistant-api:5193;
  8090 web-cmdb:80;
  18080 web:80;
  18081 web-ticketing:80;
  18082 web-inventory:80;
  18083 web-device-flow:80;
  18084 web-delivery:80;
  18085 web-faq:80;
  18086 web-tender:80;
  18087 web-train-exam:80;
  18088 web-prompt-center:80;
  18089 web-sca:80;
  18090 dependency-track-apiserver:8080;
  18091 dependency-track-frontend:8080;
  18092 web-big-screen:80;
  18093 web-ai-assistant:80;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 443 ssl;
  listen 5179 ssl;
  listen 5180 ssl;
  listen 5182 ssl;
  listen 5183 ssl;
  listen 5184 ssl;
  listen 5185 ssl;
  listen 5186 ssl;
  listen 5187 ssl;
  listen 5188 ssl;
  listen 5189 ssl;
  listen 5190 ssl;
  listen 5191 ssl;
  listen 5192 ssl;
  listen 5193 ssl;
  listen 8090 ssl;
  listen 18080 ssl;
  listen 18081 ssl;
  listen 18082 ssl;
  listen 18083 ssl;
  listen 18084 ssl;
  listen 18085 ssl;
  listen 18086 ssl;
  listen 18087 ssl;
  listen 18088 ssl;
  listen 18089 ssl;
  listen 18090 ssl;
  listen 18091 ssl;
  listen 18092 ssl;
  listen 18093 ssl;

  server_name _;
  client_max_body_size 100m;

  ssl_certificate /etc/nginx/tls/server.pem;
  ssl_certificate_key /etc/nginx/tls/server-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:AllSystemsTLS:20m;

  add_header Strict-Transport-Security "max-age=300" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  resolver 127.0.0.11 ipv6=off valid=30s;

  location / {
    proxy_pass http://$route_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

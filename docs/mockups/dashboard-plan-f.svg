    <filter id="glowF" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f97316" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#60a5fa" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bgF)"/>
  <rect x="30" y="30" width="220" height="840" rx="18" fill="#0b0f16" stroke="#1f2937"/>

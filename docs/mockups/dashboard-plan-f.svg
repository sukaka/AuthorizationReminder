    <rect x="820" y="120" width="255" height="120" rx="16" fill="url(#cardF)" stroke="#1f2937"/>
    <rect x="1095" y="120" width="275" height="120" rx="16" fill="url(#cardF)" stroke="#1f2937"/>
  </g>
  <text x="290" y="165" fill="#93c5fd" font-size="14" font-family="Arial">Expiring</text>

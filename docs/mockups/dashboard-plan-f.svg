  <text x="1115" y="205" fill="#e2e8f0" font-size="28" font-family="Arial">97%</text>

  <rect x="270" y="260" width="720" height="300" rx="18" fill="url(#cardF)" stroke="#1f2937" filter="url(#glowF)"/>

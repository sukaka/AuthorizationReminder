<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.45" stop-color="#0e1a35"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="cardE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b33"/>
      <stop offset="1" stop-color="#0b1328"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2dd4bf" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#60a5fa" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#bgE)"/>
  <g opacity="0.25">
    <path d="M0 120 H1400" stroke="#1f2b4d"/>
    <path d="M0 240 H1400" stroke="#1f2b4d"/>
    <path d="M0 360 H1400" stroke="#1f2b4d"/>
    <path d="M0 480 H1400" stroke="#1f2b4d"/>
    <path d="M0 600 H1400" stroke="#1f2b4d"/>
    <path d="M0 720 H1400" stroke="#1f2b4d"/>
    <path d="M200 0 V900" stroke="#1f2b4d"/>
    <path d="M400 0 V900" stroke="#1f2b4d"/>
    <path d="M600 0 V900" stroke="#1f2b4d"/>
    <path d="M800 0 V900" stroke="#1f2b4d"/>
    <path d="M1000 0 V900" stroke="#1f2b4d"/>
    <path d="M1200 0 V900" stroke="#1f2b4d"/>
  </g>

  <rect x="30" y="30" width="220" height="840" rx="18" fill="#0a1020" stroke="#1f2b4d"/>
  <text x="60" y="80" fill="#93c5fd" font-size="18" font-family="Arial">Plan E</text>
  <text x="60" y="110" fill="#e2e8f0" font-size="14" font-family="Arial">Cyber Control</text>

  <rect x="270" y="30" width="1100" height="70" rx="16" fill="url(#cardE)" stroke="#1f2b4d" filter="url(#glow)"/>
  <text x="300" y="75" fill="#e2e8f0" font-size="22" font-family="Arial">Dashboard</text>
  <rect x="1130" y="50" width="210" height="34" rx="10" fill="#0b1328" stroke="#1f2b4d"/>
  <text x="1160" y="73" fill="#93c5fd" font-size="12" font-family="Arial">View Switch</text>

  <g filter="url(#glow)">
    <rect x="270" y="120" width="255" height="120" rx="16" fill="url(#cardE)" stroke="#1f2b4d"/>
    <rect x="545" y="120" width="255" height="120" rx="16" fill="url(#cardE)" stroke="#1f2b4d"/>
    <rect x="820" y="120" width="255" height="120" rx="16" fill="url(#cardE)" stroke="#1f2b4d"/>
    <rect x="1095" y="120" width="275" height="120" rx="16" fill="url(#cardE)" stroke="#1f2b4d"/>
  </g>
  <text x="290" y="165" fill="#60a5fa" font-size="14" font-family="Arial">Expiring</text>
  <text x="290" y="205" fill="#e2e8f0" font-size="28" font-family="Arial">128</text>
  <text x="565" y="165" fill="#22d3ee" font-size="14" font-family="Arial">Due Today</text>
  <text x="565" y="205" fill="#e2e8f0" font-size="28" font-family="Arial">12</text>
  <text x="840" y="165" fill="#34d399" font-size="14" font-family="Arial">Total</text>
  <text x="840" y="205" fill="#e2e8f0" font-size="28" font-family="Arial">2,560</text>
  <text x="1115" y="165" fill="#fbbf24" font-size="14" font-family="Arial">Success</text>
  <text x="1115" y="205" fill="#e2e8f0" font-size="28" font-family="Arial">98%</text>

  <rect x="270" y="260" width="520" height="300" rx="18" fill="url(#cardE)" stroke="#1f2b4d" filter="url(#glow)"/>
  <text x="300" y="295" fill="#e2e8f0" font-size="16" font-family="Arial">Channel Ring</text>
  <circle cx="470" cy="420" r="90" fill="none" stroke="#1f2b4d" stroke-width="18"/>
  <circle cx="470" cy="420" r="90" fill="none" stroke="#60a5fa" stroke-width="18" stroke-dasharray="240 320"/>
  <circle cx="470" cy="420" r="70" fill="none" stroke="#22d3ee" stroke-width="18" stroke-dasharray="160 280"/>
  <circle cx="470" cy="420" r="50" fill="none" stroke="#34d399" stroke-width="18" stroke-dasharray="120 200"/>

  <rect x="820" y="260" width="550" height="300" rx="18" fill="url(#cardE)" stroke="#1f2b4d" filter="url(#glow)"/>
  <text x="850" y="295" fill="#e2e8f0" font-size="16" font-family="Arial">Radar Stability</text>
  <polygon points="1020,430 1110,390 1180,440 1160,520 1040,540" fill="rgba(96,165,250,0.25)" stroke="url(#neon)" stroke-width="2"/>
  <circle cx="1095" cy="430" r="90" fill="none" stroke="#1f2b4d"/>
  <circle cx="1095" cy="430" r="60" fill="none" stroke="#1f2b4d"/>
  <circle cx="1095" cy="430" r="30" fill="none" stroke="#1f2b4d"/>

  <rect x="270" y="580" width="1100" height="260" rx="18" fill="url(#cardE)" stroke="#1f2b4d" filter="url(#glow)"/>
  <text x="300" y="615" fill="#e2e8f0" font-size="16" font-family="Arial">Heat Calendar (35 days)</text>
  <g transform="translate(300,640)">
    <g fill="#0b1328" stroke="#1f2b4d">
      <rect x="0" y="0" width="16" height="16" rx="3"/>
      <rect x="20" y="0" width="16" height="16" rx="3"/>
      <rect x="40" y="0" width="16" height="16" rx="3"/>
      <rect x="60" y="0" width="16" height="16" rx="3"/>
      <rect x="80" y="0" width="16" height="16" rx="3"/>
    </g>
    <g fill="#22d3ee" opacity="0.8">
      <rect x="0" y="20" width="16" height="16" rx="3"/>
      <rect x="20" y="20" width="16" height="16" rx="3"/>
      <rect x="40" y="20" width="16" height="16" rx="3"/>
      <rect x="60" y="20" width="16" height="16" rx="3"/>
      <rect x="80" y="20" width="16" height="16" rx="3"/>
    </g>
    <g fill="#60a5fa" opacity="0.7">
      <rect x="0" y="40" width="16" height="16" rx="3"/>
      <rect x="20" y="40" width="16" height="16" rx="3"/>
      <rect x="40" y="40" width="16" height="16" rx="3"/>
      <rect x="60" y="40" width="16" height="16" rx="3"/>
      <rect x="80" y="40" width="16" height="16" rx="3"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#0f1c2f"/>
      <stop offset="1" stop-color="#0a1224"/>
    </linearGradient>
    <linearGradient id="cardH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowH" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#22c55e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bgH)"/>
  <rect x="30" y="30" width="220" height="840" rx="18" fill="#0b1220" stroke="#1f2b4d"/>
  <text x="60" y="80" fill="#38bdf8" font-size="18" font-family="Arial">Plan H</text>
  <text x="60" y="110" fill="#e2e8f0" font-size="14" font-family="Arial">Ops Cockpit</text>

  <rect x="270" y="30" width="1100" height="70" rx="16" fill="url(#cardH)" stroke="#1f2b4d" filter="url(#glowH)"/>
  <text x="300" y="75" fill="#e2e8f0" font-size="22" font-family="Arial">Operations Dashboard</text>

  <g filter="url(#glowH)">
    <rect x="270" y="120" width="520" height="320" rx="18" fill="url(#cardH)" stroke="#1f2b4d"/>
    <rect x="820" y="120" width="550" height="320" rx="18" fill="url(#cardH)" stroke="#1f2b4d"/>
  </g>
  <text x="300" y="155" fill="#e2e8f0" font-size="16" font-family="Arial">Matrix Heatmap</text>
  <g transform="translate(300,180)" stroke="#1f2b4d">
    <rect x="0" y="0" width="20" height="20" fill="#0f172a"/>
    <rect x="24" y="0" width="20" height="20" fill="#1d4ed8"/>
    <rect x="48" y="0" width="20" height="20" fill="#3b82f6"/>
    <rect x="72" y="0" width="20" height="20" fill="#22c55e"/>
    <rect x="96" y="0" width="20" height="20" fill="#f97316"/>
    <rect x="0" y="24" width="20" height="20" fill="#1e293b"/>
    <rect x="24" y="24" width="20" height="20" fill="#3b82f6"/>
    <rect x="48" y="24" width="20" height="20" fill="#22c55e"/>
    <rect x="72" y="24" width="20" height="20" fill="#f97316"/>
    <rect x="96" y="24" width="20" height="20" fill="#ef4444"/>
  </g>

  <text x="850" y="155" fill="#e2e8f0" font-size="16" font-family="Arial">Trend Line</text>
  <polyline points="860,360 920,300 980,320 1040,250 1100,280 1160,210 1220,240" fill="none" stroke="#38bdf8" stroke-width="3"/>

  <rect x="270" y="460" width="1100" height="380" rx="18" fill="url(#cardH)" stroke="#1f2b4d" filter="url(#glowH)"/>
  <text x="300" y="495" fill="#e2e8f0" font-size="16" font-family="Arial">Latency & Retries</text>
  <rect x="300" y="520" width="1020" height="40" rx="10" fill="#0f172a" stroke="#1f2b4d"/>
  <rect x="300" y="570" width="1020" height="40" rx="10" fill="#0f172a" stroke="#1f2b4d"/>
  <rect x="300" y="620" width="1020" height="40" rx="10" fill="#0f172a" stroke="#1f2b4d"/>
</svg>

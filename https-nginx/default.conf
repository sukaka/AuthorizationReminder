map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name 192.168.3.33 192.168.3.21;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name 192.168.3.33 192.168.3.21;

  ssl_certificate /etc/nginx/certs/juxin-ai.crt;
  ssl_certificate_key /etc/nginx/certs/juxin-ai.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 100m;
  client_body_timeout 600s;

  location = /portal {
    proxy_pass http://auth:5180;
    include /etc/nginx/proxy_params;
  }

  location ^~ /api/auth/ {
    proxy_pass http://auth:5180;
    include /etc/nginx/proxy_params;
  }

  location ^~ /admin-center {
    proxy_pass http://auth:5180;
    include /etc/nginx/proxy_params;
  }

  location ^~ /audit-center {
    proxy_pass http://auth:5180;
    include /etc/nginx/proxy_params;
  }

  location ^~ /api/admin-center/ {
    proxy_pass http://auth:5180;
    include /etc/nginx/proxy_params;
  }

  location ^~ /api/audit-center/ {
    proxy_pass http://auth:5180;
    include /etc/nginx/proxy_params;
  }

  location / {
    proxy_pass http://web-ai-assistant:80;
    include /etc/nginx/proxy_params;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }
}

      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qwen-embedding:
    profiles: ["docker-embedding"]
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - "-m"
      - "/models/Qwen3-Embedding-4B-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8091"
      - "--embedding"
      - "--pooling"
      - "last"
      - "--ctx-size"
      - "2048"
      - "--batch-size"
      - "256"
      - "--ubatch-size"
      - "256"
      - "--parallel"
      - "1"
    volumes:
      - ./Qwen3-Embedding-4B-GGUF:/models:ro
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

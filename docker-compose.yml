      MYSQL_DATABASE: juxin_prompt_center
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CORS_ORIGINS: "http://localhost:18088,http://127.0.0.1:18088,http://${PUBLIC_HOST:-localhost}:18088,http://localhost:5180,http://127.0.0.1:5180,http://${PUBLIC_HOST:-localhost}:5180"
    depends_on:
      - mysql
      - auth
    ports:
      - "5189:5189"

  web-prompt-center:
    build:
      context: ./prompt-center/frontend
      args: *build_args_node_alpine_nginx
    depends_on:
      - prompt-center-api
      - auth
    ports:
      - "18088:80"

  onlyoffice:
    build:
      context: ./faq/onlyoffice-fonts
      dockerfile: Dockerfile
      args: *build_args_onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${FAQ_DOC_EDITOR_JWT_SECRET}
      JWT_HEADER: "Authorization"
      JWT_IN_BODY: "true"
      WOPI_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    restart: unless-stopped

  train-exam-onlyoffice:
    build:
      context: ./faq/onlyoffice-fonts
      dockerfile: Dockerfile
      args: *build_args_onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${TRAIN_EXAM_DOC_EDITOR_JWT_SECRET}
      JWT_HEADER: "Authorization"
      JWT_IN_BODY: "true"
      WOPI_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    restart: unless-stopped

  cmdb-mysql-init:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    depends_on:
      - mysql
    entrypoint: ["/bin/sh", "/scripts/init-cmdb-db.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CMDB_MYSQL_PASSWORD: ${CMDB_MYSQL_PASSWORD}
      INIT_SQL_PATH: /migrations/001_init_cmdb.sql
    volumes:
      - ./cmdb/migrations/mysql/001_init_cmdb.sql:/migrations/001_init_cmdb.sql:ro
      - ./cmdb/scripts/init-cmdb-db.sh:/scripts/init-cmdb-db.sh:ro
    restart: "no"

  cmdb:
    build:
      context: ./cmdb
      dockerfile: Dockerfile
      args: *build_args_cmdb
    depends_on:
      cmdb-mysql-init:
        condition: service_completed_successfully
      auth:
        condition: service_started
    environment:
      APP_NAME: cmdb
      APP_ENV: dev
      HTTP_ADDR: ":8088"
      READ_TIMEOUT_SEC: 10
      WRITE_TIMEOUT_SEC: 15
      MYSQL_DSN: "cmdb_user:${CMDB_MYSQL_PASSWORD}@tcp(mysql:3306)/cmdb?parseTime=true&charset=utf8mb4,utf8"
      MYSQL_MAX_OPEN_CONNS: 30
      MYSQL_MAX_IDLE_CONNS: 10
      OUTBOX_ENABLED: "false"
      AUTH_SERVICE_URL: "http://auth:5180"
      AUTH_SYSTEM_KEY: cmdb
      AUTH_TIMEOUT_MS: 5000
      AUTH_COOKIE_NAME: "juxin_auth_token"
      BODY_MAX_BYTES: 2097152
      RATE_LIMIT_WINDOW_SEC: 60
      RATE_LIMIT_MAX: 300

  web-cmdb:
    build:
      context: ./cmdb/web
      args: *build_args_node_alpine_nginx
    depends_on:
      - cmdb
      - auth
    ports:
      - "8090:80"

volumes:
  mysql-data:
  faq-data:
  tender-data:
  train-exam-data:

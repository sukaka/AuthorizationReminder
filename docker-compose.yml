      dockerfile: Dockerfile.scanner
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO", "--queues=scanner,celery"]
    environment:
      APP_NAME: "九章软件开源组件分析系统"
      APP_ENV: dev
      APP_VERSION: ${SCA_APP_VERSION:-2.0.0}
      DATABASE_URL: "postgresql+psycopg://sca_user:${SCA_POSTGRES_PASSWORD:-change_me_sca_postgres_password}@sca-postgres:5432/juxin_sca"
      REDIS_URL: "redis://sca-redis:6379/0"
      CELERY_BROKER_URL: "redis://sca-redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://sca-redis:6379/2"
      AUTH_SERVICE_URL: "http://auth:5180"
      AUTH_SYSTEM_KEY: "sca"
      AUTH_COOKIE_NAME: "juxin_auth_token"
      AUTH_DEV_BYPASS: "false"
      CORS_ORIGINS: "http://localhost:18089,http://127.0.0.1:18089,http://${PUBLIC_HOST:-localhost}:18089"
      UPLOAD_ROOT: "/data/sca/uploads"
      CELERY_TASK_ALWAYS_EAGER: "false"
      REPORT_ROOT: "/data/sca/reports"
      SBOM_ROOT: "/data/sca/sbom"
      OPENSCA_ENABLED: ${SCA_OPENSCA_ENABLED:-true}
      OPENSCA_PATH: "/usr/local/bin/opensca"
      OPENSCA_TIMEOUT: ${SCA_OPENSCA_TIMEOUT:-3600}
      OPENSCA_OUTPUT_DIR: "/data/scanner-results/opensca"
      SYFT_ENABLED: ${SCA_SYFT_ENABLED:-true}
      SYFT_PATH: "/usr/local/bin/syft"
      SYFT_TIMEOUT: ${SCA_SYFT_TIMEOUT:-1800}
      SYFT_OUTPUT_DIR: "/data/scanner-results/syft"
      SYFT_DEFAULT_FORMATS: ${SCA_SYFT_DEFAULT_FORMATS:-cyclonedx-json,spdx-json}
      TRIVY_ENABLED: ${SCA_TRIVY_ENABLED:-true}
      TRIVY_PATH: "/usr/local/bin/trivy"
      TRIVY_TIMEOUT: ${SCA_TRIVY_TIMEOUT:-3600}
      TRIVY_CACHE_DIR: "/data/trivy-cache"
      TRIVY_OUTPUT_DIR: "/data/scanner-results/trivy"
      DEPENDENCY_TRACK_ENABLED: ${SCA_DEPENDENCY_TRACK_ENABLED:-${DEPENDENCY_TRACK_ENABLED:-true}}
      DEPENDENCY_TRACK_URL: ${SCA_DEPENDENCY_TRACK_URL:-${DEPENDENCY_TRACK_URL:-http://dependency-track-apiserver:8080}}
      DEPENDENCY_TRACK_API_KEY: ${SCA_DEPENDENCY_TRACK_API_KEY:-${DEPENDENCY_TRACK_API_KEY:-}}
      DEPENDENCY_TRACK_TIMEOUT: ${SCA_DEPENDENCY_TRACK_TIMEOUT:-${DEPENDENCY_TRACK_TIMEOUT:-1800}}
      DEPENDENCY_TRACK_AUTO_CREATE_PROJECT: ${SCA_DEPENDENCY_TRACK_AUTO_CREATE_PROJECT:-${DEPENDENCY_TRACK_AUTO_CREATE_PROJECT:-true}}
      DEPENDENCY_TRACK_UPLOAD_BOM: ${SCA_DEPENDENCY_TRACK_UPLOAD_BOM:-${DEPENDENCY_TRACK_UPLOAD_BOM:-true}}
      DEPENDENCY_TRACK_FETCH_FINDINGS: ${SCA_DEPENDENCY_TRACK_FETCH_FINDINGS:-${DEPENDENCY_TRACK_FETCH_FINDINGS:-true}}
      MULTI_ENGINE_MERGE_ENABLED: ${SCA_MULTI_ENGINE_MERGE_ENABLED:-true}
      LOW_CONFIDENCE_AUTO_REVIEW: ${SCA_LOW_CONFIDENCE_AUTO_REVIEW:-true}
      SAVE_RAW_REPORTS: ${SCA_SAVE_RAW_REPORTS:-true}
      OPENAI_API_KEY: ${SCA_OPENAI_API_KEY:-}
      OPENAI_API_URL: ${SCA_OPENAI_API_URL:-https://api.openai.com/v1/chat/completions}
      OPENAI_MODEL: ${SCA_OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_MS: ${SCA_OPENAI_TIMEOUT_MS:-30000}
      OSV_API_URL: ${SCA_OSV_API_URL:-https://api.osv.dev}
      NVD_API_URL: ${SCA_NVD_API_URL:-https://services.nvd.nist.gov/rest/json/cves/2.0}
      NVD_API_KEY: ${SCA_NVD_API_KEY:-}
      GITHUB_ADVISORY_URL: ${SCA_GITHUB_ADVISORY_URL:-https://api.github.com/advisories}
      GITHUB_TOKEN: ${SCA_GITHUB_TOKEN:-}
      VULNERABILITY_FETCH_TIMEOUT_MS: ${SCA_VULNERABILITY_FETCH_TIMEOUT_MS:-8000}
    volumes:
      - sca-upload-data:/data/sca/uploads
      - sca-report-data:/data/sca/reports
      - sca-sbom-data:/data/sca/sbom
      - sca-backup-data:/data/sca/backups
      - sca-scanner-results:/data/scanner-results
      - sca-trivy-cache:/data/trivy-cache
    depends_on:
      sca-postgres:
        condition: service_healthy
      sca-redis:
        condition: service_healthy

  sca-beat:
    image: codex-new-sca-beat:latest
    build:
      context: ./sca-platform/backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.celery_app.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      APP_NAME: "九章软件开源组件分析系统"
      APP_ENV: dev
      APP_VERSION: ${SCA_APP_VERSION:-2.0.0}
      DATABASE_URL: "postgresql+psycopg://sca_user:${SCA_POSTGRES_PASSWORD:-change_me_sca_postgres_password}@sca-postgres:5432/juxin_sca"
      REDIS_URL: "redis://sca-redis:6379/0"
      CELERY_BROKER_URL: "redis://sca-redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://sca-redis:6379/2"
      AUTH_SERVICE_URL: "http://auth:5180"
      AUTH_SYSTEM_KEY: "sca"
      AUTH_COOKIE_NAME: "juxin_auth_token"
      AUTH_DEV_BYPASS: "false"
      CORS_ORIGINS: "http://localhost:18089,http://127.0.0.1:18089,http://${PUBLIC_HOST:-localhost}:18089"
      UPLOAD_ROOT: "/data/sca/uploads"
      CELERY_TASK_ALWAYS_EAGER: "false"
      OSV_API_URL: ${SCA_OSV_API_URL:-https://api.osv.dev}
      NVD_API_URL: ${SCA_NVD_API_URL:-https://services.nvd.nist.gov/rest/json/cves/2.0}
      NVD_API_KEY: ${SCA_NVD_API_KEY:-}
      GITHUB_ADVISORY_URL: ${SCA_GITHUB_ADVISORY_URL:-https://api.github.com/advisories}
      GITHUB_TOKEN: ${SCA_GITHUB_TOKEN:-}
      VULNERABILITY_FETCH_TIMEOUT_MS: ${SCA_VULNERABILITY_FETCH_TIMEOUT_MS:-8000}
      REPORT_ROOT: "/data/sca/reports"
      SBOM_ROOT: "/data/sca/sbom"
      TOOL_SYFT_PATH: ${SCA_TOOL_SYFT_PATH:-syft}
      TOOL_TRIVY_PATH: ${SCA_TOOL_TRIVY_PATH:-trivy}
      TOOL_GRYPE_PATH: ${SCA_TOOL_GRYPE_PATH:-grype}
      RISK_MONITOR_INTERVAL_SECONDS: ${SCA_RISK_MONITOR_INTERVAL_SECONDS:-21600}
      GITHUB_API_URL: ${SCA_GITHUB_API_URL:-https://api.github.com}
      MAVEN_SEARCH_URL: ${SCA_MAVEN_SEARCH_URL:-https://search.maven.org/solrsearch/select}
      NPM_REGISTRY_URL: ${SCA_NPM_REGISTRY_URL:-https://registry.npmjs.org}
      PYPI_API_URL: ${SCA_PYPI_API_URL:-https://pypi.org/pypi}
      GO_PROXY_URL: ${SCA_GO_PROXY_URL:-https://proxy.golang.org}
      EOL_API_URL: ${SCA_EOL_API_URL:-https://endoflife.date/api}
      NOTIFICATION_EMAIL_ENABLED: ${SCA_NOTIFICATION_EMAIL_ENABLED:-false}
      NOTIFICATION_EMAIL_TO: ${SCA_NOTIFICATION_EMAIL_TO:-}
      OPENAI_API_KEY: ${SCA_OPENAI_API_KEY:-}
      OPENAI_API_URL: ${SCA_OPENAI_API_URL:-https://api.openai.com/v1/chat/completions}
      OPENAI_MODEL: ${SCA_OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_MS: ${SCA_OPENAI_TIMEOUT_MS:-30000}
      DEVOPS_BLOCK_SEVERITIES: ${SCA_DEVOPS_BLOCK_SEVERITIES:-critical,high}
      REMEDIATION_OVERDUE_CHECK_SECONDS: ${SCA_REMEDIATION_OVERDUE_CHECK_SECONDS:-3600}
      PRODUCTION_HTTPS_ENABLED: ${SCA_PRODUCTION_HTTPS_ENABLED:-true}
      PRODUCTION_JWT_SECURE: ${SCA_PRODUCTION_JWT_SECURE:-true}
      BACKUP_ROOT: ${SCA_BACKUP_ROOT:-/data/sca/backups}
    volumes:
      - sca-upload-data:/data/sca/uploads
      - sca-report-data:/data/sca/reports
      - sca-sbom-data:/data/sca/sbom
      - sca-backup-data:/data/sca/backups
    depends_on:
      sca-postgres:
        condition: service_healthy
      sca-redis:
        condition: service_healthy

  web-sca:
    image: codex-new-web-sca:latest
    build:
      context: ./sca-platform/frontend
      args:
        <<: *build_args_node_alpine_nginx
        VITE_API_BASE: ${VITE_SCA_API_BASE:-}
        VITE_SSO_LOGIN_URL: ${VITE_SCA_SSO_LOGIN_URL:-http://localhost:5180/sca-login}
    depends_on:
      - sca-api
      - auth
    volumes:
      - ./https-nginx/certs:/etc/nginx/certs:ro
    ports:
      - "18089:443"

  big-screen-api:
    image: codex-new-big-screen-api:latest
    build:
      context: ./big-screen-center/backend
      dockerfile: Dockerfile
      args: *build_args_node_bookworm_slim
    environment:
      PORT: 5192
      AUTH_SERVICE_URL: "http://auth:5180"
      AUTH_SYSTEM_KEY: "big-screen"
      AUTH_COOKIE_NAME: "juxin_auth_token"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: juxin_big_screen
      MYSQL_USER: big_screen_user
      MYSQL_PASSWORD: ${BIG_SCREEN_MYSQL_PASSWORD:-${MYSQL_SHARED_APP_PASSWORD}}
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SCA_API_URL: "http://sca-api:5191"
      TRAIN_EXAM_API_URL: "http://train-exam-api:5188"
      REMINDER_API_URL: "http://api:5179"
      CORS_ORIGINS: "http://localhost:18092,http://127.0.0.1:18092,http://${PUBLIC_HOST:-localhost}:18092"
    depends_on:
      mysql:
        condition: service_started
      auth:
        condition: service_started
      api:
        condition: service_started
      train-exam-api:
        condition: service_started
      sca-api:
        condition: service_started
    ports:
      - "5192:5192"

  web-big-screen:
    image: codex-new-web-big-screen:latest
    build:
      context: ./big-screen-center/frontend
      dockerfile: Dockerfile
      args:
        <<: *build_args_node_alpine_nginx
        VITE_SCA_APP_URL: ${VITE_SCA_APP_URL:-}
        VITE_TRAIN_EXAM_APP_URL: ${VITE_TRAIN_EXAM_APP_URL:-}
        VITE_REMINDER_APP_URL: ${VITE_REMINDER_APP_URL:-}
    depends_on:
      big-screen-api:
        condition: service_started
      auth:
        condition: service_started
    volumes:
      - ./https-nginx/certs:/etc/nginx/certs:ro
    ports:
      - "18092:443"

  dependency-track-apiserver:
    image: dependencytrack/apiserver:4.12.2
    environment:
      ALPINE_DATABASE_MODE: external
      ALPINE_DATABASE_URL: "jdbc:postgresql://sca-postgres:5432/juxin_sca"
      ALPINE_DATABASE_DRIVER: org.postgresql.Driver
      ALPINE_DATABASE_USERNAME: sca_user
      ALPINE_DATABASE_PASSWORD: ${SCA_POSTGRES_PASSWORD:-change_me_sca_postgres_password}
      ALPINE_DATABASE_POOL_ENABLED: "true"
    volumes:
      - dependency-track-data:/data
    depends_on:
      sca-postgres:
        condition: service_healthy
    ports:
      - "${SCA_DEPENDENCY_TRACK_API_PORT:-${DEPENDENCY_TRACK_API_PORT:-18090}}:8080"

  dependency-track-frontend:
    image: dependencytrack/frontend:4.12.2
    environment:
      API_BASE_URL: ${SCA_DEPENDENCY_TRACK_PUBLIC_API_URL:-${DEPENDENCY_TRACK_PUBLIC_API_URL:-http://localhost:18090}}
    depends_on:
      - dependency-track-apiserver
    ports:
      - "${SCA_DEPENDENCY_TRACK_WEB_PORT:-${DEPENDENCY_TRACK_WEB_PORT:-18091}}:8080"

  onlyoffice:
    build:
      context: ./faq/onlyoffice-fonts
      dockerfile: Dockerfile
      args: *build_args_onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${FAQ_DOC_EDITOR_JWT_SECRET}
      JWT_HEADER: "Authorization"
      JWT_IN_BODY: "true"
      WOPI_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    restart: unless-stopped

  train-exam-onlyoffice:
    build:
      context: ./faq/onlyoffice-fonts
      dockerfile: Dockerfile
      args: *build_args_onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${TRAIN_EXAM_DOC_EDITOR_JWT_SECRET}
      JWT_HEADER: "Authorization"
      JWT_IN_BODY: "true"
      WOPI_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    restart: unless-stopped

  cmdb-mysql-init:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    depends_on:
      - mysql
    entrypoint: ["/bin/sh", "/scripts/init-cmdb-db.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CMDB_MYSQL_PASSWORD: ${CMDB_MYSQL_PASSWORD}
      INIT_SQL_PATH: /migrations/001_init_cmdb.sql
    volumes:
      - ./cmdb/migrations/mysql/001_init_cmdb.sql:/migrations/001_init_cmdb.sql:ro
      - ./cmdb/scripts/init-cmdb-db.sh:/scripts/init-cmdb-db.sh:ro
    restart: "no"

  cmdb:
    build:
      context: ./cmdb
      dockerfile: Dockerfile
      args: *build_args_cmdb
    depends_on:
      cmdb-mysql-init:
        condition: service_completed_successfully
      auth:
        condition: service_started
    environment:
      APP_NAME: cmdb
      APP_ENV: dev
      HTTP_ADDR: ":8088"
      READ_TIMEOUT_SEC: 10
      WRITE_TIMEOUT_SEC: 15
      MYSQL_DSN: "cmdb_user:${CMDB_MYSQL_PASSWORD}@tcp(mysql:3306)/cmdb?parseTime=true&charset=utf8mb4,utf8"
      MYSQL_MAX_OPEN_CONNS: 30
      MYSQL_MAX_IDLE_CONNS: 10
      OUTBOX_ENABLED: "false"
      AUTH_SERVICE_URL: "http://auth:5180"
      AUTH_SYSTEM_KEY: cmdb
      AUTH_TIMEOUT_MS: 5000
      AUTH_COOKIE_NAME: "juxin_auth_token"
      BODY_MAX_BYTES: 2097152
      RATE_LIMIT_WINDOW_SEC: 60
      RATE_LIMIT_MAX: 300

  web-cmdb:
    build:
      context: ./cmdb/web
      args: *build_args_node_alpine_nginx
    depends_on:
      - cmdb
      - auth
    volumes:
      - ./https-nginx/certs:/etc/nginx/certs:ro
    ports:
      - "18094:443"

volumes:
  ai-assistant-updates:
  ai-assistant-knowledge:
  qdrant-data:
  ai-assistant-redis-data:
  ai-assistant-keyword-index:
  mysql-data:
  faq-data:
  tender-data:
  train-exam-data:
  sca-postgres-data:
  sca-redis-data:
  sca-upload-data:
  sca-report-data:
  sca-sbom-data:
  sca-backup-data:
  sca-scanner-results:
  sca-trivy-cache:
  dependency-track-data:

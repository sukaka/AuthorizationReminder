      - "5190:5190"

  inventory-api:
    build:
      context: .
      dockerfile: inventory-system/backend/Dockerfile
      args: *build_args_node_alpine
    environment:
      PORT: 5183
      AUTH_SERVICE_URL: "http://auth:5180"

name: codex-new

x-build-args-python-slim: &build_args_python_slim
  PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
  DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-http://mirrors.aliyun.com/debian}
  DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://mirrors.aliyun.com/debian-security}

x-build-args-root-app: &build_args_root_app
  NODE_20_BOOKWORM_IMAGE: ${NODE_20_BOOKWORM_IMAGE:-node:20-bookworm}
  NODE_20_BOOKWORM_SLIM_IMAGE: ${NODE_20_BOOKWORM_SLIM_IMAGE:-node:20-bookworm-slim}
  NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}

x-build-args-node-bookworm-slim: &build_args_node_bookworm_slim
  NODE_20_BOOKWORM_SLIM_IMAGE: ${NODE_20_BOOKWORM_SLIM_IMAGE:-node:20-bookworm-slim}
  NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}

x-build-args-node-bookworm-nginx: &build_args_node_bookworm_nginx
  NODE_20_BOOKWORM_IMAGE: ${NODE_20_BOOKWORM_IMAGE:-node:20-bookworm}
  NGINX_ALPINE_IMAGE: ${NGINX_ALPINE_IMAGE:-nginx:alpine}
  NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}

x-build-args-node-alpine: &build_args_node_alpine
  NODE_20_ALPINE_IMAGE: ${NODE_20_ALPINE_IMAGE:-node:20-alpine}
  NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}

x-build-args-node-alpine-nginx: &build_args_node_alpine_nginx
  NODE_20_ALPINE_IMAGE: ${NODE_20_ALPINE_IMAGE:-node:20-alpine}
  NGINX_ALPINE_IMAGE: ${NGINX_ALPINE_IMAGE:-nginx:alpine}
  NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}

x-build-args-onlyoffice: &build_args_onlyoffice
  ONLYOFFICE_DOCUMENTSERVER_IMAGE: ${ONLYOFFICE_DOCUMENTSERVER_IMAGE:-onlyoffice/documentserver:latest}

x-build-args-cmdb: &build_args_cmdb
  GOLANG_1_22_ALPINE_IMAGE: ${GOLANG_1_22_ALPINE_IMAGE:-golang:1.22-alpine}
  ALPINE_3_20_IMAGE: ${ALPINE_3_20_IMAGE:-alpine:3.20}
  GOPROXY: ${GO_MODULE_PROXY:-https://mirrors.aliyun.com/goproxy/,direct}
  GOSUMDB: ${GO_CHECKSUM_DB:-sum.golang.google.cn}

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    entrypoint: ["/bin/sh", "/scripts/run-mysql.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: juxin_reminder
      MYSQL_USER: juxin
      MYSQL_PASSWORD: ${MYSQL_SHARED_APP_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/deploy/run-mysql.sh:/scripts/run-mysql.sh:ro
    ports:
      - "53308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    image: codex-new-api:latest
    build:
      context: .
      args: *build_args_root_app
    environment:
      PORT: 5179
      SERVE_WEB: "false"
      AUTH_SERVICE_URL: "http://auth:5180"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: juxin
      MYSQL_PASSWORD: ${MYSQL_SHARED_APP_PASSWORD}
      MYSQL_DATABASE: juxin_reminder
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CORS_ORIGINS: "http://localhost:5180,http://127.0.0.1:5180,http://${PUBLIC_HOST:-localhost}:5180,http://localhost:18080,http://127.0.0.1:18080,http://${PUBLIC_HOST:-localhost}:18080,http://localhost:18081,http://127.0.0.1:18081,http://${PUBLIC_HOST:-localhost}:18081,http://localhost:8090,http://127.0.0.1:8090,http://${PUBLIC_HOST:-localhost}:8090"
      JWT_SECRET: ${AUTH_JWT_SECRET}
      AUDIT_SIGNING_KEY: ${AUTH_AUDIT_SIGNING_KEY}
      CONFIG_SECRET_KEY: ${AUTH_CONFIG_SECRET_KEY}
      BUILTIN_ACCOUNT_DEFAULT_PASSWORD: ${AUTH_BUILTIN_ACCOUNT_DEFAULT_PASSWORD}
      SECURITY_STRICT_MODE: "true"
      CSRF_SECURE: "false"
      AUTH_FETCH_TIMEOUT_MS: 4000
      AUTH_COOKIE_NAME: "juxin_auth_token"
    depends_on:
      - mysql
    ports:
      - "5179:5179"

  auth:
    image: codex-new-auth:latest
    build:
      context: .
      dockerfile: auth/Dockerfile
      args: *build_args_node_bookworm_slim
    environment:
      PORT: 5180
      AUTH_PUBLIC_URL: "${AUTH_PUBLIC_URL:-}"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: ${AUTH_MYSQL_PASSWORD}
      MYSQL_DATABASE: juxin_reminder
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CORS_ORIGINS: "http://localhost:5180,http://127.0.0.1:5180,http://${PUBLIC_HOST:-localhost}:5180,http://localhost:18080,http://127.0.0.1:18080,http://${PUBLIC_HOST:-localhost}:18080,http://localhost:18081,http://127.0.0.1:18081,http://${PUBLIC_HOST:-localhost}:18081,http://localhost:18082,http://127.0.0.1:18082,http://${PUBLIC_HOST:-localhost}:18082,http://localhost:18083,http://127.0.0.1:18083,http://${PUBLIC_HOST:-localhost}:18083,http://localhost:18084,http://127.0.0.1:18084,http://${PUBLIC_HOST:-localhost}:18084,http://localhost:18085,http://127.0.0.1:18085,http://${PUBLIC_HOST:-localhost}:18085,http://localhost:18086,http://127.0.0.1:18086,http://${PUBLIC_HOST:-localhost}:18086,http://localhost:18087,http://127.0.0.1:18087,http://${PUBLIC_HOST:-localhost}:18087,http://localhost:18088,http://127.0.0.1:18088,http://${PUBLIC_HOST:-localhost}:18088,http://localhost:18089,http://127.0.0.1:18089,http://${PUBLIC_HOST:-localhost}:18089,http://localhost:18092,http://127.0.0.1:18092,http://${PUBLIC_HOST:-localhost}:18092,http://localhost:8090,http://127.0.0.1:8090,http://${PUBLIC_HOST:-localhost}:8090"
      APP_CMDB_URL: "http://localhost:18094"
      APP_INVENTORY_URL: "http://localhost:18082"
      APP_DEVICE_FLOW_URL: "http://localhost:18083"
      APP_DELIVERY_URL: "http://localhost:18084"
      APP_FAQ_URL: "http://localhost:18085"
      APP_TENDER_URL: "http://localhost:18086"
      APP_TRAIN_EXAM_URL: "http://localhost:18087"
      APP_PROMPT_CENTER_URL: "http://localhost:18088"
      APP_SCA_URL: "http://localhost:18089"
      APP_BIG_SCREEN_URL: "http://localhost:18092"
      APP_AI_ASSISTANT_URL: "${AI_ASSISTANT_PUBLIC_URL:-http://${PUBLIC_HOST:-localhost}:18093}"
      # These centers are served by the unified auth gateway; relative URLs keep
      # redirects on the current HTTPS origin and its configured non-standard port.
      APP_ADMIN_CENTER_URL: "/admin-center"
      APP_AUDIT_CENTER_URL: "/audit-center"
      AUDIT_SOURCE_DELIVERY_URL: "http://delivery-api:5185"
      AUDIT_SOURCE_PROMPT_CENTER_URL: "http://prompt-center-api:5189"
      AUDIT_SOURCE_AI_ASSISTANT_URL: "http://ai-assistant-api:5193"
      AUTH_COOKIE_NAME: "juxin_auth_token"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_COOKIE_SAMESITE: "lax"
      JWT_SECRET: ${AUTH_JWT_SECRET}
      AUDIT_SIGNING_KEY: ${AUTH_AUDIT_SIGNING_KEY}
      CONFIG_SECRET_KEY: ${AUTH_CONFIG_SECRET_KEY}
      BUILTIN_ACCOUNT_DEFAULT_PASSWORD: ${AUTH_BUILTIN_ACCOUNT_DEFAULT_PASSWORD}
      SECURITY_STRICT_MODE: "${AUTH_SECURITY_STRICT_MODE:-false}"
    depends_on:
      - mysql
    ports:
      - "${AUTH_HOST_PORT:-5180}:5180"

  web:
    build:
      context: ./web
      args:
        <<: *build_args_node_bookworm_nginx
        VITE_SSO_PORTAL_URL: ${VITE_SSO_PORTAL_URL:-}
    depends_on:
      - api
      - auth
    volumes:
      - ./https-nginx/certs:/etc/nginx/certs:ro
    ports:
      - "18080:443"

  ticketing:
    build:
      context: .
      dockerfile: ticketing/Dockerfile
      args: *build_args_node_bookworm_slim
    environment:
      PORT: 5182
      AUTH_SERVICE_URL: "http://auth:5180"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: juxin
      MYSQL_PASSWORD: ${MYSQL_SHARED_APP_PASSWORD}
      MYSQL_DATABASE: juxin_reminder
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CORS_ORIGINS: "http://localhost:5180,http://127.0.0.1:5180,http://${PUBLIC_HOST:-localhost}:5180,http://localhost:18080,http://127.0.0.1:18080,http://${PUBLIC_HOST:-localhost}:18080,http://localhost:18081,http://127.0.0.1:18081,http://${PUBLIC_HOST:-localhost}:18081,http://localhost:8090,http://127.0.0.1:8090,http://${PUBLIC_HOST:-localhost}:8090"
      JWT_SECRET: "3122c0763b7728783ce33c724c81fcdf3b9c77fe33cdc3cbfe5a6f4a896634ea"
      AUDIT_SIGNING_KEY: "53bc691c095c27647ff02d056637f09482b963d7c9a104454e44376b685b8c3e"
      SECURITY_STRICT_MODE: "true"
      AUTH_FETCH_TIMEOUT_MS: 4000
      AUTH_COOKIE_NAME: "juxin_auth_token"
      TICKET_ATTACHMENT_ALLOWED_MIME: "image/png,image/jpeg,image/jpg,image/webp,application/pdf,text/plain,application/zip,application/x-zip-compressed,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    depends_on:
      - mysql
    ports:
      - "5182:5182"
    develop:
      watch:
        - action: rebuild
          path: ./ticketing/index.js
        - action: rebuild
          path: ./ticketing/package.json
        - action: rebuild
          path: ./ticketing/package-lock.json

  web-ticketing:
    build:
      context: ./ticketing/web
      args: *build_args_node_bookworm_nginx
    depends_on:
      - ticketing
      - auth
    volumes:
      - ./https-nginx/certs:/etc/nginx/certs:ro
    ports:
      - "18081:443"
    develop:
      watch:
        - action: rebuild
          path: ./ticketing/web/src
        - action: rebuild
          path: ./ticketing/web/index.html
        - action: rebuild
          path: ./ticketing/web/nginx.conf
        - action: rebuild
          path: ./ticketing/web/package.json
        - action: rebuild
          path: ./ticketing/web/package-lock.json
        - action: rebuild
          path: ./ticketing/web/vite.config.js

  shipping-gateway:
    build:
      context: .
      dockerfile: inventory-system/shipping-gateway/Dockerfile
      args: *build_args_node_alpine
    environment:
      PORT: 5190
      SHIPPING_GATEWAY_TOKEN: "inventory-shipping-gateway-dev-token"

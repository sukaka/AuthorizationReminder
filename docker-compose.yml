      - -c
      - python scripts/bootstrap_db.py && alembic upgrade head && python scripts/seed_catalog.py --force-config --require-all-published
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: juxin_ai_assistant
      MYSQL_USER: ai_assistant_user

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: juxin_reminder
      MYSQL_USER: juxin
      MYSQL_PASSWORD: ${MYSQL_SHARED_APP_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3308:3306"
    command: --default-authentication-plugin=mysql_native_password

  api:
    build: .
    environment:
      PORT: 5179
      SERVE_WEB: "false"
      AUTH_SERVICE_URL: "http://auth:5180"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: juxin
      MYSQL_PASSWORD: juxinpass
      MYSQL_DATABASE: juxin_reminder
      CORS_ORIGINS: "http://localhost:5180,http://127.0.0.1:5180,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8090,http://127.0.0.1:8090"
      JWT_SECRET: "3122c0763b7728783ce33c724c81fcdf3b9c77fe33cdc3cbfe5a6f4a896634ea"
      AUDIT_SIGNING_KEY: "0157ac63610a6b6a1c164a502b8e08987e03b642a6713151638cc21a9d25e542"
      CONFIG_SECRET_KEY: "UeiKgUhP80JPdwWMoBRRWmKxdz8BKEP4btzTTh4QmYVc9twMEcgCKuqFDx0M4HX8"
      BUILTIN_ACCOUNT_DEFAULT_PASSWORD: "Dm1vbnqsILIVjUa5sWixBFos60bKdEKC"
      SECURITY_STRICT_MODE: "true"
      CSRF_SECURE: "false"
      AUTH_FETCH_TIMEOUT_MS: 4000
      AUTH_COOKIE_NAME: "juxin_auth_token"
    depends_on:
      - mysql
    ports:
      - "5179:5179"

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    environment:
      PORT: 5180
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: ${AUTH_MYSQL_PASSWORD}
      MYSQL_DATABASE: juxin_reminder
      CORS_ORIGINS: "http://localhost:5180,http://127.0.0.1:5180,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082,http://localhost:8083,http://127.0.0.1:8083,http://localhost:8084,http://127.0.0.1:8084,http://localhost:8085,http://127.0.0.1:8085,http://localhost:8086,http://127.0.0.1:8086,http://localhost:8087,http://127.0.0.1:8087,http://localhost:8090,http://127.0.0.1:8090"
      APP_CMDB_URL: "http://localhost:8090"
      APP_INVENTORY_URL: "http://localhost:8082"
      APP_DEVICE_FLOW_URL: "http://localhost:8083"
      APP_SEC_IMPL_URL: "http://localhost:8084"
      APP_FAQ_URL: "http://localhost:8085"
      APP_TENDER_URL: "http://localhost:8086"
      APP_TRAIN_EXAM_URL: "http://localhost:8087"
      AUTH_COOKIE_NAME: "juxin_auth_token"
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAMESITE: "lax"
      JWT_SECRET: ${AUTH_JWT_SECRET}
      AUDIT_SIGNING_KEY: ${AUTH_AUDIT_SIGNING_KEY}
      CONFIG_SECRET_KEY: ${AUTH_CONFIG_SECRET_KEY}
      BUILTIN_ACCOUNT_DEFAULT_PASSWORD: ${AUTH_BUILTIN_ACCOUNT_DEFAULT_PASSWORD}
      SECURITY_STRICT_MODE: "true"
    depends_on:
      - mysql
    ports:
      - "5180:5180"

  web:
    build: ./web
    depends_on:
      - api
      - auth
    ports:
      - "8080:80"

  ticketing:
    build:
      context: .
      dockerfile: ticketing/Dockerfile
    environment:
      PORT: 5182
      AUTH_SERVICE_URL: "http://auth:5180"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: juxin
      MYSQL_PASSWORD: juxinpass
      MYSQL_DATABASE: juxin_reminder
      CORS_ORIGINS: "http://localhost:5180,http://127.0.0.1:5180,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081,http://localhost:8090,http://127.0.0.1:8090"
      JWT_SECRET: "3122c0763b7728783ce33c724c81fcdf3b9c77fe33cdc3cbfe5a6f4a896634ea"
      AUDIT_SIGNING_KEY: "53bc691c095c27647ff02d056637f09482b963d7c9a104454e44376b685b8c3e"
      SECURITY_STRICT_MODE: "true"
      AUTH_FETCH_TIMEOUT_MS: 4000
      AUTH_COOKIE_NAME: "juxin_auth_token"
      TICKET_ATTACHMENT_ALLOWED_MIME: "image/png,image/jpeg,image/jpg,image/webp,application/pdf,text/plain,application/zip,application/x-zip-compressed,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    depends_on:
      - mysql
    ports:
      - "5182:5182"
    develop:
      watch:
        - action: rebuild
          path: ./ticketing/index.js
        - action: rebuild
          path: ./ticketing/package.json
        - action: rebuild
          path: ./ticketing/package-lock.json

  web-ticketing:
    build: ./ticketing/web
    depends_on:
      - ticketing
      - auth
    ports:
      - "8081:80"
    develop:
      watch:
        - action: rebuild
          path: ./ticketing/web/src
        - action: rebuild
          path: ./ticketing/web/index.html
        - action: rebuild
          path: ./ticketing/web/nginx.conf
        - action: rebuild
          path: ./ticketing/web/package.json
        - action: rebuild
          path: ./ticketing/web/package-lock.json
        - action: rebuild
          path: ./ticketing/web/vite.config.js

  shipping-gateway:
    build: ./inventory-system/shipping-gateway
    environment:
      PORT: 5190
      SHIPPING_GATEWAY_TOKEN: "inventory-shipping-gateway-dev-token"
      SHIPPING_GATEWAY_TIMEOUT_MS: 8000
      CORS_ORIGINS: "http://localhost:5183,http://127.0.0.1:5183,http://localhost:8082,http://127.0.0.1:8082"
      RATE_LIMIT_WINDOW_SEC: 60
      RATE_LIMIT_MAX: 240
      SHIPPING_GATEWAY_ALLOW_MOCK: "0"
      CAINIAO_TRACKING_API_URL: ""
      CAINIAO_TRACKING_API_TOKEN: ""
      CAINIAO_TRACKING_TIMEOUT_MS: 8000
      CAINIAO_APP_KEY: ""
      CAINIAO_APP_SECRET: ""
      SF_TRACKING_API_URL: ""
      SF_TRACKING_API_TOKEN: ""
      SF_TRACKING_TIMEOUT_MS: 8000
      SF_CUSTOMER_CODE: ""
      SF_CHECKWORD: ""
      JD_TRACKING_API_URL: ""
      JD_TRACKING_API_TOKEN: ""
      JD_TRACKING_TIMEOUT_MS: 8000
      JD_APP_KEY: ""
      JD_APP_SECRET: ""
    ports:
      - "5190:5190"

  inventory-api:
    build: ./inventory-system/backend
    environment:
      PORT: 5183
      AUTH_SERVICE_URL: "http://auth:5180"
      AUTH_SYSTEM_KEY: "inventory"
      AUTH_FETCH_TIMEOUT_MS: 5000
      AUTH_COOKIE_NAME: "juxin_auth_token"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: juxin
      MYSQL_PASSWORD: juxinpass
      MYSQL_DATABASE: juxin_inventory
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: rootpass
      CORS_ORIGINS: "http://localhost:8082,http://127.0.0.1:8082"
      RATE_LIMIT_WINDOW_SEC: 60
      RATE_LIMIT_MAX: 300
      SHIPPING_TRACKING_API_URL: "http://shipping-gateway:5190/api/track/query"
      SHIPPING_TRACKING_API_TOKEN: "inventory-shipping-gateway-dev-token"
      SHIPPING_TRACKING_API_TIMEOUT_MS: 8000
      REMINDER_WEBHOOK_TIMEOUT_MS: 5000
    depends_on:
      - mysql
      - auth
      - shipping-gateway
    ports:
      - "5183:5183"

  web-inventory:
    build: ./inventory-system/frontend
    depends_on:
      - inventory-api
    ports:
      - "8082:80"

  device-flow-api:
    build: ./device-flow/backend
    environment:
      PORT: 5184
      AUTH_SERVICE_URL: "http://auth:5180"
      AUTH_SYSTEM_KEY: "device-flow"
      AUTH_FETCH_TIMEOUT_MS: 5000
      AUTH_COOKIE_NAME: "juxin_auth_token"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: juxin
      MYSQL_PASSWORD: juxinpass
      MYSQL_DATABASE: juxin_device_flow
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: rootpass
      CORS_ORIGINS: "http://localhost:8083,http://127.0.0.1:8083"
      DASHBOARD_OVERDUE_DAYS: 3
      SLA_AUTO_RUN_INTERVAL_MS: 300000
      MAX_BATCH_STAGE_JOB_IDS: 200
      MAX_IMPORT_ROWS: 500
      AUDIT_SIGNING_KEY: "device-flow-audit-signing-key-change-me"
      UPLOAD_ROOT: "/tmp/device-flow/uploads"
      UPLOAD_MAX_FILE_SIZE_MB: 10
    depends_on:
      - mysql
      - auth
    ports:
      - "5184:5184"

  web-device-flow:
    build: ./device-flow/frontend
    depends_on:
      - device-flow-api
    ports:
      - "8083:80"

  sec-impl-api:
    build: ./sec-impl/backend
    environment:
      PORT: 5185
      AUTH_SERVICE_URL: "http://auth:5180"
      AUTH_SYSTEM_KEY: "sec-impl"
      AUTH_FETCH_TIMEOUT_MS: 5000
      AUTH_COOKIE_NAME: "juxin_auth_token"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: sec_impl_user
      MYSQL_PASSWORD: sec_impl_pass
      MYSQL_DATABASE: juxin_sec_impl
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: rootpass
      CORS_ORIGINS: "http://localhost:8084,http://127.0.0.1:8084"
      DASHBOARD_OVERDUE_DAYS: 3
      SLA_AUTO_RUN_INTERVAL_MS: 300000
      MAX_BATCH_STAGE_JOB_IDS: 200
      MAX_IMPORT_ROWS: 500
      AUDIT_SIGNING_KEY: "sec-impl-audit-signing-key-change-me"
      UPLOAD_ROOT: "/tmp/sec-impl/uploads"
      UPLOAD_MAX_FILE_SIZE_MB: 10
    depends_on:
      - mysql
      - auth
    ports:
      - "5185:5185"

  web-sec-impl:
    build: ./sec-impl/frontend
    depends_on:
      - sec-impl-api
      - auth
    ports:
      - "8084:80"

  faq-api:
    build: ./faq/backend
    environment:
      PORT: 5186
      AUTH_SERVICE_URL: "http://auth:5180"
      AUTH_SYSTEM_KEY: "faq"
      AUTH_FETCH_TIMEOUT_MS: 5000
      AUTH_COOKIE_NAME: "juxin_auth_token"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: faq_user
      MYSQL_PASSWORD: ${FAQ_MYSQL_PASSWORD}
      MYSQL_DATABASE: juxin_faq
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CORS_ORIGINS: "http://localhost:8085,http://127.0.0.1:8085"
      UPLOAD_ROOT: "/data/faq/uploads"
      PREVIEW_ROOT: "/data/faq/previews"
      DRAFT_ROOT: "/data/faq/drafts"
      EDITABLE_ROOT: "/data/faq/editable"
      UPLOAD_MAX_FILE_SIZE_MB: 20
      EDITOR_LOCK_MINUTES: 20
      DOC_EDITOR_PROVIDER: "onlyoffice"
      DOC_EDITOR_PUBLIC_PATH: "/doc-editor"
      DOC_EDITOR_FILE_BASE_URL: "http://faq-api:5186"
      DOC_EDITOR_CALLBACK_BASE_URL: "http://faq-api:5186"
      DOC_EDITOR_JWT_SECRET: ${FAQ_DOC_EDITOR_JWT_SECRET}
      LIBREOFFICE_BIN: "soffice"
    volumes:
      - faq-data:/data/faq
    depends_on:
      - mysql
      - auth
      - onlyoffice
    ports:
      - "5186:5186"

  web-faq:
    build: ./faq/frontend
    depends_on:
      - faq-api
      - auth
      - onlyoffice
    ports:
      - "8085:80"

  tender-api:
    build: ./tender/backend
    environment:
      PORT: 5187
      AUTH_SERVICE_URL: "http://auth:5180"
      AUTH_SYSTEM_KEY: "tender"
      AUTH_FETCH_TIMEOUT_MS: 5000
      AUTH_COOKIE_NAME: "juxin_auth_token"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: tender_user
      MYSQL_PASSWORD: tender_pass
      MYSQL_DATABASE: juxin_tender
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: rootpass
      CORS_ORIGINS: "http://localhost:8086,http://127.0.0.1:8086"
      UPLOAD_ROOT: "/data/tender/uploads"
      VERSION_ROOT: "/data/tender/uploads/versions"
      DRAFT_ROOT: "/data/tender/uploads/drafts"
      ASSET_ROOT: "/data/tender/uploads/assets"
      WATERMARK_ROOT: "/data/tender/uploads/watermarks"
      PREVIEW_ROOT: "/data/tender/uploads/previews"
      EDITABLE_ROOT: "/data/tender/uploads/editable"
      UPLOAD_MAX_FILE_SIZE_MB: 30
      LIBREOFFICE_BIN: "soffice"
      DOC_EDITOR_PROVIDER: "onlyoffice"
      DOC_EDITOR_PUBLIC_PATH: "/doc-editor"
      DOC_EDITOR_FILE_BASE_URL: "http://tender-api:5187"
      DOC_EDITOR_CALLBACK_BASE_URL: "http://tender-api:5187"
      DOC_EDITOR_JWT_SECRET: ${FAQ_DOC_EDITOR_JWT_SECRET}
      EDITOR_SESSION_TTL_MINUTES: 120
      AUDIT_SIGNING_KEY: "tender-audit-signing-key-change-me"
      CONFIG_SECRET_KEY: "tender-config-secret-change-me-32chars"
      AUDIT_RETENTION_DAYS: 365
      AUDIT_CLEANUP_INTERVAL_MS: 86400000
      OCR_ACCESS_KEY_ID: ""
      OCR_ACCESS_KEY_SECRET: ""
      OCR_ENDPOINT: "ocr.cn-beijing.aliyuncs.com"
      OCR_API_VERSION: "2021-07-07"
      AI_OPENAI_BASE_URL: ""
      AI_OPENAI_API_KEY: ""
      AI_QWEN_MODEL_NAME: "qwen3.5"
      AI_KIMI_MODEL_NAME: "kimi-2.5"
      AI_CLAUDE_MODEL_NAME: "claude"
    volumes:
      - tender-data:/data/tender
    depends_on:
      - mysql
      - auth
      - onlyoffice
    ports:
      - "5187:5187"

  web-tender:
    build: ./tender/frontend
    depends_on:
      - tender-api
      - auth
      - onlyoffice
    ports:
      - "8086:80"

  train-exam-api:
    build: ./train-exam/backend
    environment:
      PORT: 5188
      AUTH_SERVICE_URL: "http://auth:5180"
      AUTH_SYSTEM_KEY: "train-exam"
      AUTH_FETCH_TIMEOUT_MS: 5000
      AUTH_COOKIE_NAME: "juxin_auth_token"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: train_exam_user
      MYSQL_PASSWORD: ${TRAIN_EXAM_MYSQL_PASSWORD}
      MYSQL_DATABASE: juxin_train_exam
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      FAQ_MYSQL_HOST: mysql
      FAQ_MYSQL_PORT: 3306
      FAQ_MYSQL_USER: faq_user
      FAQ_MYSQL_PASSWORD: ${FAQ_MYSQL_PASSWORD}
      FAQ_MYSQL_DATABASE: juxin_faq
      CORS_ORIGINS: "http://localhost:8087,http://127.0.0.1:8087"
      RESOURCE_ROOT: "/data/train-exam/resources"
      IMPORT_ROOT: "/data/train-exam/imports"
      CERT_ROOT: "/data/train-exam/certificates"
      UPLOAD_MAX_FILE_SIZE_MB: 50
      AUDIT_SIGNING_KEY: ${TRAIN_EXAM_AUDIT_SIGNING_KEY}
      AI_OPENAI_BASE_URL: ""
      AI_OPENAI_API_KEY: ""
      AI_MODEL_NAME: ""
      DOC_EDITOR_PROVIDER: "onlyoffice"
      DOC_EDITOR_PUBLIC_PATH: "/doc-editor"
      DOC_EDITOR_FILE_BASE_URL: "http://train-exam-api:5188"
      DOC_EDITOR_JWT_SECRET: ${TRAIN_EXAM_DOC_EDITOR_JWT_SECRET}
      DOC_PREVIEW_MIN_SECONDS: 45
      SECURITY_STRICT_MODE: "true"
      CSRF_SECURE: "false"
    volumes:
      - train-exam-data:/data/train-exam
    depends_on:
      - mysql
      - auth
      - train-exam-onlyoffice
    ports:
      - "5188:5188"

  web-train-exam:
    build: ./train-exam/frontend
    depends_on:
      - train-exam-api
      - auth
      - train-exam-onlyoffice
    ports:
      - "8087:80"

  onlyoffice:
    build:
      context: ./faq/onlyoffice-fonts
      dockerfile: Dockerfile
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${FAQ_DOC_EDITOR_JWT_SECRET}
      JWT_HEADER: "Authorization"
      JWT_IN_BODY: "true"
      WOPI_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    restart: unless-stopped

  train-exam-onlyoffice:
    build:
      context: ./faq/onlyoffice-fonts
      dockerfile: Dockerfile
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${TRAIN_EXAM_DOC_EDITOR_JWT_SECRET}
      JWT_HEADER: "Authorization"
      JWT_IN_BODY: "true"
      WOPI_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    restart: unless-stopped

  cmdb-mongo:
    image: docker.m.daocloud.io/library/mongo:7.0
    volumes:
      - cmdb-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 20

  cmdb-mysql-init:
    image: docker.m.daocloud.io/library/mysql:8.0
    depends_on:
      - mysql
    entrypoint: ["/bin/sh", "-c"]
    command: >
      '
      for i in $$(seq 1 60); do
        mysql --default-character-set=utf8mb4 -hmysql -uroot -prootpass -e "SELECT 1" >/dev/null 2>&1 && break;
        echo "waiting for mysql...";
        sleep 2;
      done;
      mysql --default-character-set=utf8mb4 -hmysql -uroot -prootpass < /migrations/001_init_cmdb.sql;
      echo "cmdb mysql initialized";
      '
    volumes:
      - ./cmdb/migrations/mysql/001_init_cmdb.sql:/migrations/001_init_cmdb.sql:ro
    restart: "no"

  cmdb:
    build:
      context: ./cmdb
      dockerfile: Dockerfile
    depends_on:
      cmdb-mongo:
        condition: service_healthy
      cmdb-mysql-init:
        condition: service_completed_successfully
      auth:
        condition: service_started
    environment:
      APP_NAME: cmdb
      APP_ENV: dev
      HTTP_ADDR: ":8088"
      READ_TIMEOUT_SEC: 10
      WRITE_TIMEOUT_SEC: 15
      MYSQL_DSN: "root:rootpass@tcp(mysql:3306)/cmdb?parseTime=true&charset=utf8mb4,utf8"
      MYSQL_MAX_OPEN_CONNS: 30
      MYSQL_MAX_IDLE_CONNS: 10
      MONGO_URI: "mongodb://cmdb-mongo:27017"
      MONGO_DB: cmdb
      OUTBOX_ENABLED: "false"
      AUTH_SERVICE_URL: "http://auth:5180"
      AUTH_SYSTEM_KEY: cmdb
      AUTH_TIMEOUT_MS: 5000
      AUTH_COOKIE_NAME: "juxin_auth_token"
      BODY_MAX_BYTES: 2097152
      RATE_LIMIT_WINDOW_SEC: 60
      RATE_LIMIT_MAX: 300

  web-cmdb:
    build: ./cmdb/web
    depends_on:
      - cmdb
      - auth
    ports:
      - "8090:80"

volumes:
  mysql-data:
  cmdb-mongo-data:
  faq-data:
  tender-data:
  train-exam-data:

services:
  auth:
    environment:
      APP_AI_ASSISTANT_URL: ${AI_ASSISTANT_PUBLIC_URL:?set AI_ASSISTANT_PUBLIC_URL to an HTTPS Origin}
      CORS_ORIGINS: ${AI_ASSISTANT_PUBLIC_URL:?set AI_ASSISTANT_PUBLIC_URL to an HTTPS Origin}
      AUTH_COOKIE_SECURE: "true"
      AUTH_SECURITY_STRICT_MODE: "true"
    ports: !override []

  ai-assistant-api:
    environment:
      AUTH_PUBLIC_URL: ${AI_ASSISTANT_PUBLIC_URL:?set AI_ASSISTANT_PUBLIC_URL to an HTTPS Origin}
      PUBLIC_URL: ${AI_ASSISTANT_PUBLIC_URL:?set AI_ASSISTANT_PUBLIC_URL to an HTTPS Origin}
      CORS_ORIGINS: ${AI_ASSISTANT_PUBLIC_URL:?set AI_ASSISTANT_PUBLIC_URL to an HTTPS Origin}
    ports: !override []

  web-ai-assistant:
    build:
      args:
        VITE_AUTH_PUBLIC_URL: ${AI_ASSISTANT_PUBLIC_URL:?set AI_ASSISTANT_PUBLIC_URL to an HTTPS Origin}
    ports: !override []

  ai-assistant-https:
    image: ${NGINX_ALPINE_IMAGE:-nginx:alpine}
    depends_on:
      auth:
        condition: service_started
      web-ai-assistant:
        condition: service_started
    ports:
      - target: 443
        published: "443"
        protocol: tcp
    volumes:
      - ./juxin-ai-assistant/deploy/https/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${AI_ASSISTANT_TLS_CERT:?set AI_ASSISTANT_TLS_CERT}:/etc/nginx/tls/cert.pem:ro
      - ${AI_ASSISTANT_TLS_KEY:?set AI_ASSISTANT_TLS_KEY}:/etc/nginx/tls/key.pem:ro
    restart: unless-stopped

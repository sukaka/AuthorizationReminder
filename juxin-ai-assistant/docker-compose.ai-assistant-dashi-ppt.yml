services:
  ai-assistant-api:
    environment:
      # The upstream checkout is mounted read-only and remains the runtime
      # component of the dashi-ppt Skill; it is not copied into the wrapper.
      DASHI_PPT_RUNTIME_ROOT: /opt/dashi-ppt-runtime
      DASHI_PPT_THEME_PREVIEW_PATH: /opt/dashi-ppt-skill/assets/skill/theme-style-grid.png
      # Keep generated PPTX and complete HTML project packages outside the
      # container filesystem so downloads survive an API container rebuild.
      EXPORT_STORAGE_DIR: /data/ai-assistant/dashi-ppt-exports
      CHROME_PATH: /usr/bin/chromium
    volumes:
      - ${DASHI_PPT_RUNTIME_HOST_PATH:?set DASHI_PPT_RUNTIME_HOST_PATH to the installed dashi-ppt project}:/opt/dashi-ppt-runtime:ro
      # Dashi writes its temporary HTTPS preview configuration below output/
      # while exporting PPTX/PDF. Keep the rest of the upstream runtime read-only.
      - ${DASHI_PPT_RUNTIME_HOST_PATH:?set DASHI_PPT_RUNTIME_HOST_PATH to the installed dashi-ppt project}/output:/opt/dashi-ppt-runtime/output
      - ${DASHI_PPT_RUNTIME_HOST_PATH:?set DASHI_PPT_RUNTIME_HOST_PATH to the installed dashi-ppt project}/..:/opt/dashi-ppt-skill:ro
      - ai-assistant-dashi-ppt-exports:/data/ai-assistant/dashi-ppt-exports

volumes:
  ai-assistant-dashi-ppt-exports:

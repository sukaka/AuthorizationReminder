server {
  listen 80;
  listen 443 ssl;
  http2 on;
  ssl_certificate /etc/nginx/certs/juxin-ai.crt;
  ssl_certificate_key /etc/nginx/certs/juxin-ai.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_name _;
  client_max_body_size 100m;
  # Resolve through Docker DNS at request time.  A static proxy_pass lookup
  # keeps the old container IP after ai-assistant-api is recreated, causing 502.
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;
  set $ai_assistant_api_upstream http://ai-assistant-api:5193;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self'" always;

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /index.html =404;
  }

  # Compatibility path for clients that loaded an older bundle before the
  # auth URL build setting was added.  The auth portal is served by the
  # existing shared HTTPS gateway, never by this internal :18093 web server.
  location ^~ /portal {
    return 302 https://$host$request_uri;
  }

  location ~ ^/api/(ai|export|knowledge|personal-reference|conversations|skills|learning)(/|$) {
    proxy_pass $ai_assistant_api_upstream;
    proxy_http_version 1.1;
    proxy_buffering off;
    # Parsing and indexing large Office documents can legitimately take
    # several minutes. Keep the upload connection alive until the API has
    # committed the file instead of returning a misleading 504 after 60s.
    proxy_connect_timeout 15s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

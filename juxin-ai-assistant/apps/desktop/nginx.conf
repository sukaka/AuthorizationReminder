server {
  listen 80;
  server_name _;
  client_max_body_size 100m;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self'" always;

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /index.html =404;
  }

  # Compatibility path for clients that loaded an older bundle before the
  # auth URL build setting was added.  The auth portal is served by the
  # existing shared HTTPS gateway, never by this internal :18093 web server.
  location ^~ /portal {
    return 302 https://$host$request_uri;
  }

  location ~ ^/api/(ai|export|knowledge|personal-reference|conversations|skills|learning)(/|$) {
    proxy_pass http://ai-assistant-api:5193;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

[package]
name = "juxin-ai-assistant"
version = "5.14.0"
edition = "2021"

[lib]
name = "juxin_ai_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
keyring = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["sync", "macros", "net", "time"] }
futures-util = "0.3"
thiserror = "2"
zeroize = "1"
base64 = "0.22"
ring = "0.17"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"

[dev-dependencies]
maplit = "1"

[[permission]]
identifier = "allow-model-profile-list"
description = "允许列出当前设备的公开模型配置"
commands.allow = ["model_profile_list"]

[[permission]]
identifier = "allow-model-profile-upsert"
description = "允许保存当前设备的模型配置"
commands.allow = ["model_profile_upsert"]

[[permission]]
identifier = "allow-model-profile-delete"
description = "允许删除当前设备的模型配置"
commands.allow = ["model_profile_delete"]

[[permission]]
identifier = "allow-model-profile-set-default"
description = "允许设置当前设备的默认模型"
commands.allow = ["model_profile_set_default"]

[[permission]]
identifier = "allow-model-profile-test"
description = "允许测试当前设备的模型配置"
commands.allow = ["model_profile_test"]

[[permission]]
identifier = "allow-model-generate"
description = "允许使用当前设备模型生成内容"
commands.allow = ["model_generate"]

[[permission]]
identifier = "allow-model-cancel"
description = "允许取消当前设备的模型请求"
commands.allow = ["model_cancel"]

server {
  listen 80;
  listen 443 ssl;
  http2 on;
  ssl_certificate /etc/nginx/certs/juxin-ai.crt;
  ssl_certificate_key /etc/nginx/certs/juxin-ai.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_name _;
  server_tokens off;
  resolver 127.0.0.11 ipv6=off valid=10s;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self' http://localhost:5180 http://127.0.0.1:5180 https://$host:5180 $scheme://$host:5180; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:;" always;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/big-screen/ {
    set $big_screen_api_upstream big-screen-api:5192;
    proxy_pass http://$big_screen_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    add_header X-Accel-Buffering "no";
  }

  location = /__big_screen_auth_check {
    internal;
    set $big_screen_api_upstream big-screen-api:5192;
    proxy_pass http://$big_screen_api_upstream/api/big-screen/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Original-URI $request_uri;
  }

  location @big_screen_login {
    return 302 $scheme://$host:5180/portal?system=big-screen;
  }

  location ~ ^/(play|playlists|edit)/ {
    if ($arg_mock = "1") {
      rewrite ^ /index.html last;
    }
    auth_request /__big_screen_auth_check;
    error_page 401 = @big_screen_login;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location /health {
    set $big_screen_api_upstream big-screen-api:5192;
    proxy_pass http://$big_screen_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
}

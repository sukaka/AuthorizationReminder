services:
  sca-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-juxin_sca}
      POSTGRES_USER: ${POSTGRES_USER:-sca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_sca_postgres_password}
    volumes:
      - sca-postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sca_user} -d ${POSTGRES_DB:-juxin_sca}"]
      interval: 10s
      timeout: 5s
      retries: 10

  sca-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sca-redis-data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  sca-api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      APP_VERSION: ${SCA_APP_VERSION:-5.66.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sca-upload-data:/data/sca/uploads
      - sca-report-data:/data/sca/reports
      - sca-sbom-data:/data/sca/sbom
      - sca-backup-data:/data/sca/backups
      - sca-scanner-results:/data/scanner-results
      - sca-trivy-cache:/data/trivy-cache
    depends_on:
      sca-postgres:
        condition: service_healthy
      sca-redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-5191}:5191"

  sca-worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      APP_VERSION: ${SCA_APP_VERSION:-5.66.0}
    volumes:
      - sca-upload-data:/data/sca/uploads
      - sca-report-data:/data/sca/reports
      - sca-sbom-data:/data/sca/sbom
      - sca-backup-data:/data/sca/backups
      - sca-scanner-results:/data/scanner-results
      - sca-trivy-cache:/data/trivy-cache
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      sca-postgres:
        condition: service_healthy
      sca-redis:
        condition: service_healthy

  sca-beat:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      APP_VERSION: ${SCA_APP_VERSION:-5.66.0}
    volumes:
      - sca-upload-data:/data/sca/uploads
      - sca-report-data:/data/sca/reports
      - sca-sbom-data:/data/sca/sbom
      - sca-backup-data:/data/sca/backups
      - sca-scanner-results:/data/scanner-results
      - sca-trivy-cache:/data/trivy-cache
    command: ["celery", "-A", "app.celery_app.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      sca-postgres:
        condition: service_healthy
      sca-redis:
        condition: service_healthy

  scanner-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.scanner
    env_file:
      - .env
    environment:
      APP_VERSION: ${SCA_APP_VERSION:-5.66.0}
    volumes:
      - sca-upload-data:/data/sca/uploads
      - sca-report-data:/data/sca/reports
      - sca-sbom-data:/data/sca/sbom
      - sca-scanner-results:/data/scanner-results
      - sca-trivy-cache:/data/trivy-cache
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO", "--queues=scanner,celery"]
    depends_on:
      sca-postgres:
        condition: service_healthy
      sca-redis:
        condition: service_healthy

  dependency-track-apiserver:
    image: dependencytrack/apiserver:4.12.2
    environment:
      ALPINE_DATABASE_MODE: external
      ALPINE_DATABASE_URL: jdbc:postgresql://sca-postgres:5432/${POSTGRES_DB:-juxin_sca}
      ALPINE_DATABASE_DRIVER: org.postgresql.Driver
      ALPINE_DATABASE_USERNAME: ${POSTGRES_USER:-sca_user}
      ALPINE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_sca_postgres_password}
      ALPINE_DATABASE_POOL_ENABLED: "true"
    volumes:
      - dependency-track-data:/data
    depends_on:
      sca-postgres:
        condition: service_healthy
    ports:
      - "${DEPENDENCY_TRACK_API_PORT:-18090}:8080"

  dependency-track-frontend:
    image: dependencytrack/frontend:4.12.2
    environment:
      API_BASE_URL: ${DEPENDENCY_TRACK_PUBLIC_API_URL:-http://localhost:18090}
    depends_on:
      - dependency-track-apiserver
    ports:
      - "${DEPENDENCY_TRACK_WEB_PORT:-18091}:8080"

  web-sca:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_SSO_LOGIN_URL: ${VITE_SSO_LOGIN_URL:-http://localhost:5180/portal?system=sca}
    depends_on:
      - sca-api
    ports:
      - "${WEB_PORT:-18089}:80"

volumes:
  sca-postgres-data:
  sca-redis-data:
  sca-upload-data:
  sca-report-data:
  sca-sbom-data:
  sca-backup-data:
  sca-scanner-results:
  sca-trivy-cache:
  dependency-track-data:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1160" role="img" aria-labelledby="title desc">
  <title id="title">聚信 AI 助手 3.0 Agent Loop 与 Harness 系统架构</title>
  <desc id="desc">展示客户端、接入层、任务编排、Agent Loop、连接器、数据存储和稳定性治理之间的关系。</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { font-size: 25px; font-weight: 700; fill: #f8fafc; letter-spacing: .2px; }
    .subtitle { font-size: 11px; fill: #94a3b8; }
    .region-label { font-size: 11px; font-weight: 600; letter-spacing: .5px; }
    .component { font-size: 12px; font-weight: 600; fill: #f8fafc; text-anchor: middle; }
    .detail { font-size: 9px; fill: #a5b4fc; text-anchor: middle; }
    .arrow-label { font-size: 9px; fill: #cbd5e1; text-anchor: middle; }
    .small { font-size: 9px; fill: #94a3b8; }
    .note-title { font-size: 12px; font-weight: 700; fill: #f8fafc; }
    .note { font-size: 10px; fill: #cbd5e1; }
    .number { font-size: 10px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1700" height="1160" fill="#0f172a"/>
  <rect width="1700" height="1160" fill="url(#grid)"/>

  <text x="40" y="42" class="title">聚信 AI 助手 · 3.0 Agent Loop / Harness 架构</text>
  <text x="40" y="68" class="subtitle">统一状态契约、工具契约与恢复语义；Native 默认运行，LangGraph 通过能力开关灰度。</text>
  <rect x="1370" y="25" width="260" height="34" rx="17" fill="rgba(59,130,246,0.22)" stroke="#60a5fa"/>
  <text x="1500" y="47" class="component" fill="#bfdbfe">codex/3.0-merged · v3.0.0</text>

  <!-- Region boundaries -->
  <rect x="40" y="100" width="1200" height="120" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="58" y="119" class="region-label" fill="#22d3ee">01 · 用户与渠道层</text>
  <rect x="40" y="250" width="1200" height="130" rx="12" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="58" y="269" class="region-label" fill="#60a5fa">02 · 接入与身份边界</text>
  <rect x="40" y="410" width="1200" height="140" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="58" y="429" class="region-label" fill="#fbbf24">03 · 决策与任务编排</text>
  <rect x="40" y="580" width="1200" height="170" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="58" y="599" class="region-label" fill="#34d399">04 · Agent Loop / Harness 执行层</text>
  <rect x="40" y="780" width="1200" height="245" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="58" y="799" class="region-label" fill="#a78bfa">05 · 模型、连接器与持久化</text>

  <!-- Reliability panel -->
  <rect x="1280" y="100" width="360" height="925" rx="12" fill="rgba(30,41,59,0.45)" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="1305" y="132" class="note-title">稳定性不变量</text>
  <text x="1305" y="151" class="small">所有路径都必须可观测、可恢复、可对账</text>

  <rect x="1305" y="175" width="310" height="118" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <circle cx="1330" cy="202" r="13" fill="#60a5fa"/><text x="1330" y="206" class="number">01</text>
  <text x="1355" y="205" class="note-title">Run / Step 状态契约</text>
  <text x="1322" y="229" class="note">queued → running → paused</text>
  <text x="1322" y="247" class="note">→ succeeded / failed / cancelled</text>
  <text x="1322" y="270" class="small">schema version 不匹配时 fail-closed</text>

  <rect x="1305" y="315" width="310" height="118" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <circle cx="1330" cy="342" r="13" fill="#fbbf24"/><text x="1330" y="346" class="number">02</text>
  <text x="1355" y="345" class="note-title">Tool Invocation 契约</text>
  <text x="1322" y="369" class="note">参数校验 · 幂等键 · 权限门禁</text>
  <text x="1322" y="387" class="note">调用日志 · 结果摘要 · 成本计量</text>
  <text x="1322" y="410" class="small">未知工具 / 未知结果禁止放行</text>

  <rect x="1305" y="455" width="310" height="118" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
  <circle cx="1330" cy="482" r="13" fill="#34d399"/><text x="1330" y="486" class="number">03</text>
  <text x="1355" y="485" class="note-title">Checkpoint + Lease Fencing</text>
  <text x="1322" y="509" class="note">步骤级 checkpoint 持久化</text>
  <text x="1322" y="527" class="note">租约心跳 · 单 owner · 接管恢复</text>
  <text x="1322" y="550" class="small">旧 fencing token 写入必须被拒绝</text>

  <rect x="1305" y="595" width="310" height="118" rx="8" fill="#0f172a" stroke="#fb923c" stroke-width="1.2"/>
  <circle cx="1330" cy="622" r="13" fill="#fb923c"/><text x="1330" y="626" class="number">04</text>
  <text x="1355" y="625" class="note-title">Outbound 对账语义</text>
  <text x="1322" y="649" class="note">发送前绑定 · 幂等发送 · 未知结果</text>
  <text x="1322" y="667" class="note">进入 reconciliation backlog</text>
  <text x="1322" y="690" class="small">禁止未知结果下盲目重发副作用</text>

  <rect x="1305" y="750" width="310" height="125" rx="8" fill="rgba(136,19,55,0.22)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="1322" y="779" class="note-title" fill="#fecdd3">发布门禁（fail-closed）</text>
  <text x="1322" y="804" class="note">本地 Gate → staging 真实证据</text>
  <text x="1322" y="823" class="note">→ 分阶段灰度 → 生产回滚窗口</text>
  <text x="1322" y="850" class="small">迁移双 head、鉴权、checkpointer、SLO</text>
  <text x="1322" y="865" class="small">任一证据缺失，不得宣称稳定</text>


<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Songti/Simsun family aliases -->
  <alias>
    <family>SimSun</family>
    <prefer>
      <family>AR PL SungtiL GB</family>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
    </prefer>
  </alias>
  <alias>
    <family>NSimSun</family>
    <prefer>
      <family>AR PL SungtiL GB</family>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
    </prefer>
  </alias>
  <alias>
    <family>宋体</family>
    <prefer>
      <family>AR PL SungtiL GB</family>
      <family>Noto Serif CJK SC</family>
      <family>AR PL UMing CN</family>
    </prefer>
  </alias>
  <alias>
    <family>Songti SC</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>AR PL SungtiL GB</family>
    </prefer>
  </alias>

  <!-- Kaiti family aliases -->
  <alias>
    <family>KaiTi</family>
    <prefer>
      <family>AR PL KaitiM GB</family>
      <family>AR PL UKai CN</family>
      <family>cwTeXKai</family>
    </prefer>
  </alias>
  <alias>
    <family>楷体</family>
    <prefer>
      <family>AR PL KaitiM GB</family>
      <family>AR PL UKai CN</family>
      <family>cwTeXKai</family>
    </prefer>
  </alias>
  <alias>
    <family>Kaiti SC</family>
    <prefer>
      <family>AR PL KaitiM GB</family>
      <family>AR PL UKai CN</family>
      <family>cwTeXKai</family>
    </prefer>
  </alias>

  <!-- FangSong family aliases -->
  <alias>
    <family>FangSong</family>
    <prefer>
      <family>cwTeXFangSong</family>
      <family>AR PL UMing CN</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>仿宋</family>
    <prefer>
      <family>cwTeXFangSong</family>
      <family>AR PL UMing CN</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>

  <!-- Heiti/YaHei style aliases -->
  <alias>
    <family>SimHei</family>
    <prefer>
      <family>WenQuanYi Zen Hei</family>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
    </prefer>
  </alias>
  <alias>
    <family>黑体</family>
    <prefer>
      <family>WenQuanYi Zen Hei</family>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
    </prefer>
  </alias>
  <alias>
    <family>Microsoft YaHei</family>
    <prefer>
      <family>WenQuanYi Micro Hei</family>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>
  <alias>
    <family>微软雅黑</family>
    <prefer>
      <family>WenQuanYi Micro Hei</family>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>
  <alias>
    <family>PingFang SC</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
      <family>WenQuanYi Micro Hei</family>
      <family>WenQuanYi Zen Hei</family>
    </prefer>
  </alias>
</fontconfig>
